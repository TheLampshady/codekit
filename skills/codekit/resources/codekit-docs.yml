# Installed by `/codekit init`. Keeps this app's project docs (Product Map,
# Decision Log, and Glossary) current in Linear, for PMs who don't read the
# code. The Decision Log is built from the spec documents on each merged
# ticket's issue.
#
# Runs after each PR merged into BASE_BRANCH and updates only what the new
# commits changed. claude-code-action doesn't accept `push` events, so a direct
# push to BASE_BRANCH is picked up by the next merge's run. Run it by hand from
# the Actions tab with "full" checked to rebuild the map from scratch.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (Claude Pro or Max)
#   LINEAR_API_KEY           Linear: Settings > Security & access > Personal API keys
# and `codekit.linear-project` in .config/.gitconfig.

name: codekit project docs

on:
  pull_request:
    types: [closed]
    branches: [BASE_BRANCH]
    # A PR that only touches these can't change what users see, so no runner
    # starts. Nothing is lost: the next run diffs from the last synced commit.
    # Edit the list to fit the project.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/**"
      - ".config/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/__tests__/**"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/*_test.*"
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/uv.lock"
      - "**/poetry.lock"
      - "**/Cargo.lock"
      - "**/go.sum"
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild the product map from scratch
        type: boolean
        default: false

# One run at a time, so two merges never write the same document at once.
# A run that's skipped while another waits is caught up by the next one,
# because each run starts from the commit the map was last synced to.
concurrency:
  group: codekit-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    # A closed PR that wasn't merged has nothing to sync.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Check out the base branch itself, not the PR's merge ref: the map
      # records the commit it synced to, and that commit must be on the branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TMPDIR: ${{ runner.temp }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job only reads the repo, so the workflow's own token is enough
          # (no Claude GitHub App or `id-token: write` needed).
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/TheLampshady/codekit.git
          plugins: codekit@codekit-marketplace
          prompt: /codekit:project-docs --ci ${{ inputs.full && '--full' || '' }}
          claude_args: >-
            --add-dir ${{ runner.temp }}
            --allowedTools "Read,Glob,Grep,Write,Edit,Bash(cp *),Bash(mkdir *),Bash(git config *),Bash(git symbolic-ref *),Bash(git log *),Bash(git diff *),Bash(git rev-parse *),Bash(git merge-base *),Bash(git ls-files *),Bash(git ls-tree *),Bash(git show *),Bash(python3 *)"

      # A denied tool doesn't fail the action, so the docs could silently go
      # unpublished. Fail the job and name the tools to add to --allowedTools.
      - name: Check for denied tools
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          denied=$(jq -r '[.[] | select(.type == "result") | .permission_denials[]?.tool_name] | unique | join(", ")' "$LOG")
          if [ -n "$denied" ]; then
            echo "::error::Claude was denied: $denied. The docs may not have been published. Add them to --allowedTools in this workflow."
            exit 1
          fi
