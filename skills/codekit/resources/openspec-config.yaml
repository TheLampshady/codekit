# openspec/config.yaml, generated by `/codekit init`.
# `context` is prepended to every artifact (keep it well under OpenSpec's 50KB limit).
# `rules` are injected only into the matching artifact.
schema: spec-driven

context: |
  ## Project
  PROJECT_SUMMARY

  ## Stack
  STACK_SUMMARY

  ## Principles (MUST unless marked SHOULD)
  FULL_PRINCIPLES_POINTER
  - Modular code: one purpose per function and module. If describing it needs "and", split it.
    Search for an existing helper, by behavior, before writing one. Logic written twice becomes one shared helper.
  - Consistency: one solution per recurring problem (data refresh after writes, error handling,
    date formatting, copy strings), and one name per concept across code, copy, and docs.
  - Testable by design: business logic is pure; side effects sit in boundary functions tested by mocking shared clients.
    Tests run with the network blocked by default.
  - Required tests: pure logic, components, pages/views, API endpoints/services, and an app-entry smoke test.
    Tests ship in the same change. Missing tests block review.
  - Test economy: each behavior is tested once, at the cheapest layer that can observe it. Find the existing owning test before adding one.
    Mocks hold no business rules and fail loudly on unexercised calls. Branching logic lives in pure functions.
    Trimming tests must not drop covered lines. A test must be able to fail for a reason the code doesn't already guarantee.
  - Change-tolerant tests: never pin counts, order, or records of app-loaded data; validate per-record invariants instead.
    Tests build their own data. Assert only the fields under test, and outcomes rather than call sequences. No large snapshots.
  - Copy-resilient tests: never match on human-readable copy. Use roles and data-testid, error codes, enum values, and mock data.
  - Import-time safety: nothing at module level touches the network. Clients initialize lazily or through an explicit init().
  - Boundary logging: log at entry and exit points, external calls, errors, and startup/shutdown. Never inside pure logic.
  - Quality gates: every commit passes pre-commit (QUALITY_GATES_SUMMARY). Never use --no-verify.
  - No backwards compatibility before first release: replace code, schemas, and data shapes outright, with no shims or migrations.
  - Existing conventions are the baseline: don't change working setup unless the spec says so.
    Fewest moving parts, platform defaults, one knob per fact, no setting without a consumer.
    Any new infrastructure is an open question for the owner, never an assumption.

  ## Project patterns
  PROJECT_PATTERNS

  ## Governance
  Spec before plan, plan before code. If a spec conflicts with these principles, fix the spec.
  Specs record the commit they were checked against. Re-check if the code has moved since.

rules:
  proposal:
    - List any new resource, role, secret, environment, or setting as an open question for the owner. Never assume it exists.
    - Name the existing conventions and project patterns the change builds on.
  specs:
    - Use Given/When/Then scenarios that state behavior a caller depends on, not implementation detail.
  design:
    - Reuse the project patterns above. Justify any second solution to a problem the codebase already solves.
    - Put decision logic in pure functions and keep I/O in boundary functions.
    - Defer network work to first use or an explicit init(). Nothing runs at import.
  tasks:
    - Every task that adds behavior includes its tests in the same task. Never add a separate "add tests later" task.
    - A testing task names the existing test file it extends, or states that the behavior has no owning test yet.
    - End with a task to run the quality gates (QUALITY_GATES_SUMMARY).
